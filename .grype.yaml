# Narrow Oracle Linux FIPS feed false positives. This image uses the normal
# (non-FIPS, epoch 1) channel and already has newer upstream patched releases.
# Oracle's FIPS validation packages use epoch 10, producing a wrong comparison.
# Evidence: https://linux.oracle.com/errata/ELSA-2026-50075.html
# https://linux.oracle.com/errata/ELSA-2026-500448.html
# https://linux.oracle.com/errata/ELSA-2026-50346.html
# Exact package versions prevent these exceptions from covering future builds.
ignore:
  - vulnerability: ELSA-2026-50075
    package: {name: openssl, version: '1:3.5.9-1.0.1.el9_9', type: rpm}
  - vulnerability: ELSA-2026-50075
    package: {name: openssl-libs, version: '1:3.5.9-1.0.1.el9_9', type: rpm}
  - vulnerability: ELSA-2026-500448
    package: {name: openssl, version: '1:3.5.9-1.0.1.el9_9', type: rpm}
  - vulnerability: ELSA-2026-500448
    package: {name: openssl-libs, version: '1:3.5.9-1.0.1.el9_9', type: rpm}
  - vulnerability: ELSA-2026-50346
    package: {name: gnutls, version: '3.8.10-9.el9_8', type: rpm}
