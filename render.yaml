# Frontend only. Django and MySQL run on Coolify / Acnologia.
services:
  - type: web
    name: hdfc-bank-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: PUBLIC_API_URL
        value: https://hdfc-bank.duckdns.org
