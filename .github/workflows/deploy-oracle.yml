name: Deploy Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oracle-main
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, mysql]
        include:
          - component: api
            context: backend
          - component: web
            context: frontend
          - component: mysql
            context: infrastructure/mysql
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/vaibhavsh0120/hdfc-bank:${{ matrix.component }}-main
            ghcr.io/vaibhavsh0120/hdfc-bank:${{ matrix.component }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Vaibhavsh0120/HDFC-Bank
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bank-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=bank-${{ matrix.component }}
      - name: Scan the exact image and block fixable high or critical findings
        run: |
          docker run --rm -v "$PWD/.grype.yaml:/config.yaml:ro" \
            anchore/grype:v0.121.0 \
            registry:ghcr.io/vaibhavsh0120/hdfc-bank:${{ matrix.component }}-${{ github.sha }} \
            --platform linux/amd64 --config /config.yaml -o json > image-scan.json
          python3 - <<'PY'
          import json
          matches = json.load(open('image-scan.json'))['matches']
          blocked = [m for m in matches if m['vulnerability']['severity'] in ('High', 'Critical')
                     and m['vulnerability'].get('fix', {}).get('state') == 'fixed']
          print('Fixable high/critical findings:', len(blocked))
          print('Full scan, including unresolved upstream findings, is retained as an artifact.')
          if blocked:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-${{ matrix.component }}
          path: '*scan.json'
          if-no-files-found: ignore

  deploy:
    needs: [images, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the latest main images through a signed Coolify webhook
        env:
          DEPLOY_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          sha = os.environ['GITHUB_SHA']
          request = urllib.request.Request(
              'https://api.github.com/repos/Vaibhavsh0120/HDFC-Bank/commits/main',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'bank-oracle-deploy'})
          with urllib.request.urlopen(request, timeout=30) as response:
              latest = json.load(response)['sha']
          if latest != sha:
              print('A newer main commit exists; this deployment is superseded.')
              raise SystemExit(0)
          secret = os.environ['DEPLOY_SECRET']
          if not secret:
              raise SystemExit('COOLIFY_WEBHOOK_SECRET is required.')
          body = json.dumps({'ref': 'refs/heads/main', 'after': sha,
              'repository': {'full_name': 'Vaibhavsh0120/HDFC-Bank'}}).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://volcanica-oracle.duckdns.org/webhooks/source/github/events/manual',
              data=body, headers={'Content-Type': 'application/json', 'X-GitHub-Event': 'push',
                                 'X-Hub-Signature-256': 'sha256=' + signature})
          with urllib.request.urlopen(request, timeout=60) as response:
              results = json.load(response)
          for result in results:
              print(result.get('application'), result.get('status'), result.get('message'))
          if len(results) != 2 or any(r.get('status') != 'success' for r in results):
              raise SystemExit('Coolify did not queue both applications.')
          PY
