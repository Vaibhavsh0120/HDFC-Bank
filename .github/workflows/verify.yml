name: Verify project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt pip-audit
      - run: python -m pip check
      - run: python -m pip_audit --local
      - run: python backend/manage.py check --settings=config.test_settings
      - run: python backend/manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python backend/manage.py test banking --settings=config.mysql_test_settings --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_API_URL: https://example.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build
